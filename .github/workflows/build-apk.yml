name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass heisenberg-tycoon-2024 -keypass heisenberg-tycoon-2024 \
            -dname "CN=Heisenberg Tycoon, OU=Game, O=Sully, L=Albuquerque, ST=NM, C=US"

      - name: Init TWA project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: heisenberg-tycoon-2024
          BUBBLEWRAP_KEY_PASSWORD: heisenberg-tycoon-2024
        run: |
          printf '\n\n\n\n\n\n\n\n\n\n\n\n' | bubblewrap init \
            --manifest="https://sully132.github.io/Breaking-Bad-tycoon/manifest.json" \
            --directory=./android \
            --signingKeyPath=../android.keystore \
            --signingKeyAlias=android

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: heisenberg-tycoon-2024
          BUBBLEWRAP_KEY_PASSWORD: heisenberg-tycoon-2024
        run: bubblewrap build --directory=./android --skipPwaValidation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heisenberg-tycoon-apk
          path: android/app-release-signed.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: android/app-release-signed.apk
